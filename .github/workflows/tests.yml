name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Static checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The official Playwright image has all browsers preinstalled and renders screenshots like the Linux baselines.
    # Keep the tag in sync with the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v6
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # All projects: API (the backend is started by Playwright), GUI in three browsers and visual tests.
      - run: npx playwright test
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 90
